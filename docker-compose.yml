services:

  # ── API service ───────────────────────────────────────────────────────────────
  # Connects to a metadata DB you provide via env vars (see env/.env).
  #
  # Two run modes, picked by the command argument:
  #   docker compose up                  → runs the API (default CMD = "api")
  #   docker compose run --rm api setup  → one-shot setup: applies migrations
  #                                         to your metadata DB and runs the
  #                                         four indexing scripts, then exits.
  api:
    build: .
    # Restart only on real failures. The entrypoint exits 0 deliberately
    # when registered_databases is empty (asking the admin to populate it),
    # and `unless-stopped` would restart in a loop after that exit.
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      # ── LLM endpoint (your external vLLM / Ollama server) ────────────────────
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}

      # ── Metadata DB connection (application user) ────────────────────────────
      METADATA_DB_HOST: ${METADATA_DB_HOST}
      METADATA_DB_PORT: ${METADATA_DB_PORT:-5432}
      METADATA_DB_USER: ${METADATA_DB_USER:-nl2sql_user}
      METADATA_DB_NAME: ${METADATA_DB_NAME:-nl2sql_metadata}
      METADATA_DB_PASSWORD: ${METADATA_DB_PASSWORD}

      # ── Metadata DB superuser ────────────────────────────────────────────────
      # Used on startup to create the metadata DB + nl2sql_user role if missing
      # and to apply migrations (CREATE EXTENSION vector / pgcrypto).
      METADATA_DB_ADMIN_USER: ${METADATA_DB_ADMIN_USER:-postgres}
      METADATA_DB_ADMIN_PASSWORD: ${METADATA_DB_ADMIN_PASSWORD:-}

      # ── Target-DB credential encryption ──────────────────────────────────────
      # Symmetric key used to encrypt/decrypt the db_password_encrypted column
      # on registered_databases. The same key must be used by whoever inserts
      # rows (admin panel or manual psql).
      DB_CRED_ENCRYPTION_KEY: ${DB_CRED_ENCRYPTION_KEY}

      # JWT secret for token validation
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

      # Cosine similarity floor for off-topic rejection (default 0.5)
      MIN_RELEVANCE_SCORE: ${MIN_RELEVANCE_SCORE:-0.5}

      # Privilege sync toggle. Set to "true" only if a target DB follows the
      # ERPHUB convention (privileges/emp_roles/role_privileges tables).
      RUN_PRIVILEGE_SYNC: ${RUN_PRIVILEGE_SYNC:-false}
    volumes:
      # Cache the BGE-M3 model files between container restarts.
      # Without this, the ~2 GB model would be re-downloaded every time.
      - hf_cache:/root/.cache/huggingface
    extra_hosts:
      # Lets the container reach services bound to your host's loopback
      # (e.g. a vLLM server running on your laptop). Use host.docker.internal
      # as the hostname in LLM_BASE_URL.
      - "host.docker.internal:host-gateway"

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  hf_cache:   # Hugging Face model cache (BGE-M3) — persists across restarts
